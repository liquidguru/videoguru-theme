name = "videoguru-site"
compatibility_date = "2026-09-01"

# Static site only (no Worker code): everything in ./dist is served as-is, on its own hostname.
# Wrangler creates the DNS record for videoguru.liquid.guru on deploy; no *.workers.dev URL.
routes = [{ pattern = "videoguru.liquid.guru", custom_domain = true }]
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
